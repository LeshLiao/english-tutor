services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      API_KEY: ${API_KEY}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app          # 開發用熱重載；venv 在 /opt/venv 不受影響
    depends_on:
      db:
        condition: service_healthy
    # 每次啟動先套用 migration，再以 --reload 啟動
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  mcp:
    build: ./mcp-server
    environment:
      BACKEND_URL: http://backend:8000
      API_KEY: ${API_KEY}       # 同一把 key：打後端用它，client 連 MCP 也要帶它
      MCP_TRANSPORT: http
    ports:
      - "8001:8001"
    depends_on:
      backend:
        condition: service_healthy
    profiles: ["http"]          # 第二階段才啟用：docker compose --profile http up
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build: ./frontend
    environment:
      API_KEY: ${API_KEY}       # nginx 用這個注入 X-API-Key
    ports:
      - "3001:80"               # 本機 3000 被 open-webui 佔用
    depends_on:
      backend:
        condition: service_healthy
    profiles: ["prod"]          # 開發時用 npm run dev，不啟動這個

  adminer:
    image: adminer
    ports:
      - "8081:8080"   # 本機 8080 被 Jenkins 佔用
    depends_on:
      - db

volumes:
  pgdata:
